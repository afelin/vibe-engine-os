name: Vibe Auto Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_number:
        description: PR number to attempt merge
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Attempt auto-merge when checks are green
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VIBE_AUTO_MERGE: ${{ vars.VIBE_AUTO_MERGE }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run pr:auto-merge -- "${{ github.event.pull_request.number }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm run pr:auto-merge -- "${{ github.event.inputs.pull_number }}"
          else
            npm run pr:auto-merge -- --sha "${{ github.event.check_suite.head_sha }}"
          fi
