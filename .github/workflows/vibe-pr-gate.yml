name: Vibe PR Promotion Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  promotion-gate:
    name: Vibe Promotion Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Run npm check
        id: check
        run: npm run check
        continue-on-error: true

      - name: Troubleshoot hint on npm check failure
        if: steps.check.outcome != 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIBE_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          HINT='npm run orchestrate -- troubleshoot "npm check failing" --max-level 1'
          {
            echo "## Troubleshoot"
            echo ""
            echo "\`$HINT\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if command -v gh >/dev/null 2>&1 && [ -n "${VIBE_PR_NUMBER:-}" ]; then
            gh pr comment "$VIBE_PR_NUMBER" --body "Promotion gate \`npm check\` failed. Local heal:

\`\`\`bash
$HINT
\`\`\`" || true
          fi

      - name: Post Vibe Promotion Gate on PR head
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          VIBE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VIBE_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          CONCLUSION=success
          if [ "${{ steps.check.outcome }}" != "success" ]; then
            CONCLUSION=failure
          fi
          npm run promote:post-pr-gate -- --conclusion "$CONCLUSION"

      - name: Require npm check pass
        if: steps.check.outcome != 'success'
        run: exit 1
