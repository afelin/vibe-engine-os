name: Sovereign OS Event Bus

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: os-thread-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  run-os:
    runs-on: ubuntu-latest
    if: ${{ !github.event.sender.bot }}
    
    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚡ Ultra-Fast Runtime (Bun)
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 📦 Install Project Dependencies
        run: bun install

      - name: 📦 Install System Utilities (Cached)
        run: bun install -g repomix typescript vitest wrangler

      - name: 🗺️ Map Global State
        run: repomix --output repomix-output.txt

      - name: 🔀 Route Event Context (Multi-line Safe)
        id: context
        env:
          BODY_ISSUE: ${{ github.event.issue.body }}
          BODY_COMMENT: ${{ github.event.comment.body }}
          BODY_REVIEW: ${{ github.event.review.body }}
        run: |
          write_env_multiline() {
            local name="$1"
            local value="$2"
            local delimiter="EOF_${name}_$(uuidgen)"
            {
              echo "${name}<<${delimiter}"
              printf '%s\n' "$value"
              echo "${delimiter}"
            } >> "$GITHUB_ENV"
          }

          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "ISSUE_NUMBER=${{ github.event.issue.number }}" >> $GITHUB_ENV
            echo "ISSUE_TITLE=${{ github.event.issue.title }} (Revision)" >> $GITHUB_ENV
            COMMENT_CONTEXT=$(printf 'Operator comment:\n%s\n\nOriginal issue:\n%s' "$BODY_COMMENT" "$BODY_ISSUE")
            write_env_multiline "ISSUE_BODY" "$COMMENT_CONTEXT"
          elif [ "${{ github.event_name }}" == "pull_request_review" ] || [ "${{ github.event_name }}" == "pull_request_review_comment" ]; then
            echo "ISSUE_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
            echo "ISSUE_TITLE=${{ github.event.pull_request.title }} (PR Feedback)" >> $GITHUB_ENV
            PR_TITLE="${{ github.event.pull_request.title }}"
            if [ "${{ github.event_name }}" == "pull_request_review" ]; then
              REVIEW_BODY="$BODY_REVIEW"
            else
              REVIEW_BODY="$BODY_COMMENT"
            fi
            if [ -z "$REVIEW_BODY" ]; then
              REVIEW_CONTEXT=$(printf 'Release gate trigger: pull_request_review\nPR title: %s\n\nRequired outputs:\n- src/pr-review-smoke.ts\n- src/pr-review-smoke.test.ts' "$PR_TITLE")
            else
              REVIEW_CONTEXT=$(printf 'PR review feedback:\n%s\n\nPR title: %s' "$REVIEW_BODY" "$PR_TITLE")
            fi
            write_env_multiline "ISSUE_BODY" "$REVIEW_CONTEXT"
          else
            echo "ISSUE_NUMBER=${{ github.event.issue.number }}" >> $GITHUB_ENV
            echo "ISSUE_TITLE=${{ github.event.issue.title }}" >> $GITHUB_ENV
            write_env_multiline "ISSUE_BODY" "$BODY_ISSUE"
          fi

      - name: 🧠 Fire AI Inference Ratchet (agent.ts)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_COMMENT_ID: ${{ github.event.comment.id || github.event.review.id || github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bun run agent.ts

      - name: 🧹 Hardware-Accelerated Formatting (oxlint & oxfmt)
        if: ${{ env.VIBE_OPERATOR_ONLY != '1' }}
        continue-on-error: true
        run: |
          bunx oxlint@latest --fix
          bunx oxfmt@latest -w .

      - name: 🚀 Deploy Vibe Blueprint to Cloudflare Edge
        if: ${{ env.VIBE_OPERATOR_ONLY != '1' && (env.VIBE_APPROVAL_REQUIRED != '1' || env.APPROVED_BY != '') }}
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Safe Edge deployment execution block via Wrangler CLI
          if [ ! -z "$CLOUDFLARE_API_TOKEN" ]; then
            # We add '|| true' so a Cloudflare failure doesn't crash the PR handoff
            OUTPUT=$(bunx wrangler pages deploy . --project-name="vibe-engine-os" --branch="vibe/issue-${{ env.ISSUE_NUMBER }}" 2>&1) || true
            
            # Extract the preview URL safely
            PREVIEW_URL=$(echo "$OUTPUT" | grep -oE "https://[a-zA-Z0-9.-]+\.pages\.dev" | head -1)
            
            if [ -z "$PREVIEW_URL" ]; then
              echo "PREVIEW_URL=cloudflare-failed.local" >> $GITHUB_ENV
              echo "⚠️ Cloudflare deploy failed. Ensure the project 'vibe-engine-os' is created in your CF Dashboard."
            else
              echo "PREVIEW_URL=$PREVIEW_URL" >> $GITHUB_ENV
            fi
          else
            echo "PREVIEW_URL=https://cloudflare-preview-not-configured.local" >> $GITHUB_ENV
          fi

      - name: 🔄 Smart Git Sync & PR Handoff
        if: ${{ env.VIBE_OPERATOR_ONLY != '1' && (env.VIBE_APPROVAL_REQUIRED != '1' || env.APPROVED_BY != '') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Vibe Engine OS"
          git config --global user.email "ai@vibe-engine.local"
          
          BRANCH_NAME="vibe/issue-${{ env.ISSUE_NUMBER }}"
          git checkout $BRANCH_NAME || git checkout -b $BRANCH_NAME

          if [ -n "${GENERATED_FILES:-}" ]; then
            while IFS= read -r file; do
              [ -n "$file" ] && git add "$file"
            done <<< "$GENERATED_FILES"
          else
            git add src/ tests/ .planning/ .skills/
          fi

          git commit -m "feat(ai): causal compilation & edge deployment for #${{ env.ISSUE_NUMBER }}" || echo "No changes to commit"
          git push origin $BRANCH_NAME || git push --set-upstream origin $BRANCH_NAME
          
          gh pr create \
            --title "🚀 Vibe Compilation: ${{ env.ISSUE_TITLE }}" \
            --body "Autonomous xmachines compilation complete. Evaluated via Vitest. Formatted via Oxlint.
            
            🌐 **Live Edge Preview URL:** ${{ env.PREVIEW_URL }}
            
            Closes #${{ env.ISSUE_NUMBER }}" \
            --base main \
            --head $BRANCH_NAME || echo "PR already exists, updated in place."
