name: Sovereign OS Event Bus

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to process (launch proof / manual)
        required: true
        type: string
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: write

concurrency:
  group: os-thread-${{ github.event.issue.number || github.event.inputs.issue_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate-check:
    runs-on: ubuntu-latest
    if: ${{ !github.event.sender.bot }}
    outputs:
      should_run: ${{ steps.label_gate.outputs.should_run }}
      issue_number: ${{ steps.context.outputs.issue_number }}
    steps:
      - name: Label gate
        id: label_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ISSUE: ${{ github.event.inputs.issue_number }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          SHOULD_RUN=0
          LABELS_LOWER=$(echo "$ISSUE_LABELS" | tr '[:upper:]' '[:lower:]')
          BODY="$ISSUE_BODY"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$DISPATCH_ISSUE" ]; then
            ISSUE_JSON=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${DISPATCH_ISSUE}")
            LABELS_LOWER=$(echo "$ISSUE_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);console.log((j.labels||[]).map(l=>l.name).join(',').toLowerCase())})")
            BODY=$(echo "$ISSUE_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);process.stdout.write(j.body||'')})")
          fi
          if [ "$EVENT_NAME" = "issue_comment" ]; then BODY="$COMMENT_BODY"; fi
          if [ "$EVENT_NAME" = "pull_request_review" ] || [ "$EVENT_NAME" = "pull_request_review_comment" ]; then
            BODY="${REVIEW_BODY:-$BODY}"
          fi
          if echo "$LABELS_LOWER" | grep -q "vibe/run"; then SHOULD_RUN=1; fi
          if echo "$BODY" | grep -q "/vibe"; then SHOULD_RUN=1; fi
          if echo "$BODY" | grep -Eq '^/(plan|approve|continue|retry|rollback|status|deploy|details)'; then SHOULD_RUN=1; fi
          if [ "$EVENT_NAME" = "pull_request_review" ] || [ "$EVENT_NAME" = "pull_request_review_comment" ]; then SHOULD_RUN=1; fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

      - name: Enforce bound files at depth >= 3
        if: steps.label_gate.outputs.should_run == '1'
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ISSUE: ${{ github.event.inputs.issue_number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          BODY="$ISSUE_BODY"
          LABELS_LOWER=$(echo "$ISSUE_LABELS" | tr '[:upper:]' '[:lower:]')
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$DISPATCH_ISSUE" ]; then
            ISSUE_JSON=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${DISPATCH_ISSUE}")
            BODY=$(echo "$ISSUE_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);process.stdout.write(j.body||'')})")
            LABELS_LOWER=$(echo "$ISSUE_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);console.log((j.labels||[]).map(l=>l.name).join(',').toLowerCase())})")
          fi
          if [ "$EVENT_NAME" = "issue_comment" ]; then BODY="$COMMENT_BODY"; fi
          if [ "$EVENT_NAME" = "pull_request_review" ] || [ "$EVENT_NAME" = "pull_request_review_comment" ]; then
            BODY="${REVIEW_BODY:-$BODY}"
          fi

          DEPTH="${VIBE_DEPTH:-3}"
          if echo "$LABELS_LOWER" | grep -q "vibe:plan-only"; then DEPTH=1; fi
          if echo "$LABELS_LOWER" | grep -q "vibe:safe"; then DEPTH=2; fi
          if echo "$LABELS_LOWER" | grep -q "vibe:ship"; then DEPTH=4; fi

          if [ "$DEPTH" -lt 3 ]; then
            echo "Bound-file gate skipped (depth=$DEPTH)"
            exit 0
          fi

          if echo "$BODY" | grep -Eq '(^|[[:space:]])(src|tests|supabase|\.github|\.planning|\.skills)/[^[:space:]]+'; then
            echo "Bound files present in issue body"
            exit 0
          fi
          if echo "$BODY" | grep -q 'package\.json'; then
            echo "Bound files present (package.json)"
            exit 0
          fi

          echo "::error::Depth >= 3 requires bound file paths in issue body (TaskBond Files to touch section)"
          exit 1

      - name: Context outputs
        id: context
        run: |
          ISSUE_NUM="${{ github.event.issue.number || github.event.pull_request.number || github.event.inputs.issue_number }}"
          echo "issue_number=$ISSUE_NUM" >> "$GITHUB_OUTPUT"

  vibe-run:
    needs: gate-check
    if: ${{ needs.gate-check.outputs.should_run == '1' && !github.event.sender.bot }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install utilities
        run: bun install -g repomix typescript vitest wrangler

      - name: Repomix
        run: repomix --output repomix-output.txt

      - name: Route event context
        env:
          BODY_ISSUE: ${{ github.event.issue.body }}
          BODY_COMMENT: ${{ github.event.comment.body }}
          BODY_REVIEW: ${{ github.event.review.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          write_env_multiline() {
            local name="$1"
            local value="$2"
            local delimiter="EOF_${name}_$(uuidgen)"
            {
              echo "${name}<<${delimiter}"
              printf '%s\n' "$value"
              echo "${delimiter}"
            } >> "$GITHUB_ENV"
          }

          ACTIVE_LABELS="$ISSUE_LABELS"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ISSUE_NUM="${{ github.event.inputs.issue_number }}"
            DISPATCH_LABELS=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/${{ github.repository }}/issues/${ISSUE_NUM}" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);process.stdout.write((j.labels||[]).map(l=>l.name).join(','))})")
            ACTIVE_LABELS="$DISPATCH_LABELS"
            echo "VIBE_LABELS=$DISPATCH_LABELS" >> "$GITHUB_ENV"
          else
            echo "VIBE_LABELS=$ISSUE_LABELS" >> "$GITHUB_ENV"
          fi
          echo "GITHUB_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "GITHUB_RUN_ID=${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "GITHUB_DELIVERY_ID=${{ github.event.delivery_id || github.run_id }}" >> "$GITHUB_ENV"

          LABELS_LOWER=$(echo "$ACTIVE_LABELS" | tr '[:upper:]' '[:lower:]')
          DEPTH="${VIBE_DEPTH:-3}"
          if echo "$LABELS_LOWER" | grep -q "vibe:plan-only"; then DEPTH=1; fi
          if echo "$LABELS_LOWER" | grep -q "vibe:safe"; then DEPTH=2; fi
          if echo "$LABELS_LOWER" | grep -q "vibe:ship"; then DEPTH=4; fi
          if [ "$DEPTH" -ge 3 ] 2>/dev/null; then
            echo "VIBE_TEST_MODE=subgraph" >> "$GITHUB_ENV"
          else
            echo "VIBE_TEST_MODE=full" >> "$GITHUB_ENV"
          fi

          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "ISSUE_NUMBER=${{ github.event.issue.number }}" >> $GITHUB_ENV
            echo "ISSUE_TITLE=${{ github.event.issue.title }} (Revision)" >> $GITHUB_ENV
            COMMENT_CONTEXT=$(printf 'Operator comment:\n%s\n\nOriginal issue:\n%s' "$BODY_COMMENT" "$BODY_ISSUE")
            write_env_multiline "ISSUE_BODY" "$COMMENT_CONTEXT"
          elif [ "${{ github.event_name }}" == "pull_request_review" ] || [ "${{ github.event_name }}" == "pull_request_review_comment" ]; then
            echo "ISSUE_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
            echo "ISSUE_TITLE=${{ github.event.pull_request.title }} (PR Feedback)" >> $GITHUB_ENV
            PR_TITLE="${{ github.event.pull_request.title }}"
            if [ "${{ github.event_name }}" == "pull_request_review" ]; then
              REVIEW_BODY="$BODY_REVIEW"
            else
              REVIEW_BODY="$BODY_COMMENT"
            fi
            if [ -z "$REVIEW_BODY" ]; then
              REVIEW_CONTEXT=$(printf 'Release gate trigger: pull_request_review\nPR title: %s\n\nRequired outputs:\n- src/pr-review-smoke.ts\n- src/pr-review-smoke.test.ts' "$PR_TITLE")
            else
              REVIEW_CONTEXT=$(printf 'PR review feedback:\n%s\n\nPR title: %s' "$REVIEW_BODY" "$PR_TITLE")
            fi
            write_env_multiline "ISSUE_BODY" "$REVIEW_CONTEXT"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ISSUE_NUM="${{ github.event.inputs.issue_number }}"
            echo "ISSUE_NUMBER=$ISSUE_NUM" >> $GITHUB_ENV
            ISSUE_JSON=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/${{ github.repository }}/issues/${ISSUE_NUM}")
            ISSUE_TITLE=$(echo "$ISSUE_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);process.stdout.write(j.title||'')})")
            ISSUE_BODY_DISPATCH=$(echo "$ISSUE_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);process.stdout.write(j.body||'')})")
            echo "ISSUE_TITLE=${ISSUE_TITLE}" >> $GITHUB_ENV
            write_env_multiline "ISSUE_BODY" "$ISSUE_BODY_DISPATCH"
          else
            echo "ISSUE_NUMBER=${{ github.event.issue.number }}" >> $GITHUB_ENV
            echo "ISSUE_TITLE=${{ github.event.issue.title }}" >> $GITHUB_ENV
            write_env_multiline "ISSUE_BODY" "$BODY_ISSUE"
          fi

      - name: Restore .runs state
        uses: actions/cache/restore@v4
        with:
          path: .runs
          key: vibe-runs-issue-${{ needs.gate-check.outputs.issue_number }}
          restore-keys: |
            vibe-runs-issue-${{ needs.gate-check.outputs.issue_number }}

      - name: Resolve active run id
        env:
          ISSUE_NUMBER: ${{ needs.gate-check.outputs.issue_number }}
        run: |
          INDEX_FILE=".runs/index/issue-${ISSUE_NUMBER}.json"
          if [ -f "$INDEX_FILE" ]; then
            RUN_ID=$(node -e "const fs=require('fs');const i=JSON.parse(fs.readFileSync('$INDEX_FILE','utf8'));if(i.state==='completed'||i.state==='failed')process.exit(0);process.stdout.write(i.runId)")
            if [ -n "$RUN_ID" ]; then
              echo "VIBE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
              echo "Resuming run $RUN_ID from index"
            fi
          fi

      - name: Run agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_COMMENT_ID: ${{ github.event.comment.id || github.event.review.id || github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIBE_APPROVERS: ${{ secrets.VIBE_APPROVERS }}
        run: bun run agent.ts

      - name: Upload run artifact
        if: ${{ env.VIBE_OPERATOR_ONLY != '1' }}
        uses: actions/upload-artifact@v4
        env:
          ACTIONS_ARTIFACT_IGNORE_GITIGNORE: true
        with:
          name: vibe-runs-${{ github.run_id }}
          path: .runs/
          include-hidden-files: true
          if-no-files-found: warn

      - name: Save .runs state
        if: ${{ env.VIBE_OPERATOR_ONLY != '1' }}
        uses: actions/cache/save@v4
        with:
          path: .runs
          key: vibe-runs-issue-${{ needs.gate-check.outputs.issue_number }}

  vibe-promote:
    needs: [gate-check, vibe-run]
    if: ${{ needs.vibe-run.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Restore .runs state (cache fallback)
        uses: actions/cache/restore@v4
        with:
          path: .runs
          key: vibe-runs-issue-${{ needs.gate-check.outputs.issue_number }}
          restore-keys: |
            vibe-runs-issue-${{ needs.gate-check.outputs.issue_number }}

      - name: Download run artifact
        continue-on-error: true
        id: download_runs
        uses: actions/download-artifact@v4
        with:
          name: vibe-runs-${{ github.run_id }}
          path: .runs/

      - name: Validate capsule
        run: |
          RUN_ID=""
          if [ -f ".runs/run-id.txt" ]; then
            RUN_ID="$(tr -d '[:space:]' < .runs/run-id.txt)"
          fi
          if [ -n "$RUN_ID" ] && [ -f ".runs/$RUN_ID/manifest.json" ]; then
            npm run gate:validate-capsule -- . "$RUN_ID"
            echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          else
            echo "No run capsule to validate"
          fi

      - name: Bond preflight
        if: ${{ env.RUN_ID != '' }}
        env:
          ISSUE_NUMBER: ${{ needs.gate-check.outputs.issue_number }}
          RUN_ID: ${{ env.RUN_ID }}
        run: npm run bond:preflight -- . "$ISSUE_NUMBER" "$RUN_ID"

      - name: Replay determinism gate
        if: ${{ env.RUN_ID != '' }}
        env:
          RUN_ID: ${{ env.RUN_ID }}
        run: |
          if [ -f ".runs/$RUN_ID/events.ndjson" ]; then
            npm run replay -- . "$RUN_ID"
          else
            echo "No event ledger to replay (legacy run without events.ndjson)"
          fi

      - name: Apply promotion bundle
        if: ${{ env.RUN_ID != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VIBE_SKIP_CHECK: "1"
        run: npm run promote:apply -- . "$RUN_ID"

      - name: Format
        continue-on-error: true
        run: |
          bunx oxlint@latest --fix || true
          bunx oxfmt@latest -w . || true

      - name: Git sync and PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Vibe Engine OS"
          git config --global user.email "ai@vibe-engine.local"
          BRANCH_NAME="vibe/issue-${{ needs.gate-check.outputs.issue_number }}"
          git checkout "$BRANCH_NAME" || git checkout -b "$BRANCH_NAME"
          if [ -n "${RUN_ID:-}" ] && [ -f ".runs/$RUN_ID/manifest.json" ]; then
            while IFS= read -r file_path; do
              if [ -n "$file_path" ] && [ -f "$file_path" ]; then
                git add "$file_path"
              fi
            done < <(node -e "JSON.parse(require('fs').readFileSync('.runs/$RUN_ID/manifest.json','utf8')).generatedFiles.forEach(f=>console.log(f))")
          fi
          git commit -m "feat(ai): promotion for #${{ needs.gate-check.outputs.issue_number }}" -m "Assisted-by: vibe-engine-os" || echo "No changes"
          git push origin "$BRANCH_NAME" || git push --set-upstream origin "$BRANCH_NAME" || true
          echo "VIBE_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Ensure PR exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="vibe/issue-${{ needs.gate-check.outputs.issue_number }}"
          ISSUE_NUM="${{ needs.gate-check.outputs.issue_number }}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          EXISTING=$(curl -sS \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls?head=${OWNER}:${BRANCH_NAME}&state=open" \
            | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); process.stdout.write(d[0]?.html_url ?? '')")
          if [ -n "$EXISTING" ]; then
            echo "PR already open: $EXISTING"
            PR_URL="$EXISTING"
          else
            PR_URL=$(node scripts/create-pr.mjs \
              --title "feat(ai): promotion for #${ISSUE_NUM}" \
              --head "$BRANCH_NAME" \
              --body "Automated promotion for issue #${ISSUE_NUM}. Assisted-by: vibe-engine-os")
          fi
          echo "VIBE_PR_URL=$PR_URL" >> "$GITHUB_ENV"
          mkdir -p .runs
          printf '%s\n' "$PR_URL" > .runs/pr-url.txt

      - name: Update cockpit with PR link
        if: ${{ env.VIBE_PR_URL != '' && env.RUN_ID != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.gate-check.outputs.issue_number }}
          VIBE_PR_URL: ${{ env.VIBE_PR_URL }}
          RUN_ID: ${{ env.RUN_ID }}
        run: bun run src/operator/publish-pr-cockpit.ts . "$RUN_ID"

      - name: Post promotion gate on branch head
        if: ${{ env.RUN_ID != '' && env.VIBE_HEAD_SHA != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VIBE_HEAD_SHA: ${{ env.VIBE_HEAD_SHA }}
          VIBE_CHECK_ONLY: "1"
          RUN_ID: ${{ env.RUN_ID }}
        run: npm run promote:apply -- . "$RUN_ID"

  vibe-deploy:
    needs: [gate-check, vibe-promote]
    if: ${{ needs.vibe-promote.result == 'success' && vars.VIBE_DEPLOY == '1' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Download run artifact
        uses: actions/download-artifact@v4
        with:
          name: vibe-runs-${{ github.run_id }}
          path: .runs/

      - name: Read run id
        run: |
          RUN_ID=""
          if [ -f ".runs/run-id.txt" ]; then
            RUN_ID="$(tr -d '[:space:]' < .runs/run-id.txt)"
          fi
          if [ -z "$RUN_ID" ]; then
            echo "No run id in .runs/run-id.txt — deploy skipped"
            exit 1
          fi
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Validate capsule for deploy
        run: npm run gate:validate-capsule -- . "$RUN_ID"

      - name: Deploy from capsule (placeholder)
        env:
          RUN_ID: ${{ env.RUN_ID }}
        run: |
          echo "Deploy would run here for run $RUN_ID (capsule-validated, not main tip)."
          echo "Wire Cloudflare Pages OIDC: cloudflare/pages-action with id-token: write"
          echo "See docs/platform-enforcement.md for the full pattern."
