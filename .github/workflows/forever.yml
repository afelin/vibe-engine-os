name: Sovereign OS Event Bus

# 1. THE OMNI-TRIGGER: Listen to everything.
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: write
  pull-requests: write

# 2. CONCURRENCY LOCK: Prevent AI clones from overwriting each other.
concurrency:
  group: os-thread-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  run-os:
    runs-on: ubuntu-latest
    # 3. INFINITE LOOP PREVENTION: Do not trigger on bot comments.
    if: ${{ !github.event.sender.bot }}
    
    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚡ Ultra-Fast Runtime (Bun)
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # 4. THE PHYSICS MULTIPLIER: vitest added to the global utility install
      - name: 📦 Install System Utilities (Cached)
        run: bun install -g repomix typescript vitest

      - name: 🗺️ Map Global State
        run: repomix --output repomix-output.txt

      - name: 🔀 Route Event Context
        id: context
        run: |
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "ISSUE_BODY=${{ github.event.comment.body }}" >> $GITHUB_ENV
            echo "ISSUE_NUMBER=${{ github.event.issue.number }}" >> $GITHUB_ENV
            echo "ISSUE_TITLE=${{ github.event.issue.title }} (Revision)" >> $GITHUB_ENV
          else
            echo "ISSUE_BODY=${{ github.event.issue.body }}" >> $GITHUB_ENV
            echo "ISSUE_NUMBER=${{ github.event.issue.number }}" >> $GITHUB_ENV
            echo "ISSUE_TITLE=${{ github.event.issue.title }}" >> $GITHUB_ENV
          fi

      - name: 🧠 Fire AI Inference Ratchet (agent.ts)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bun run agent.ts

      - name: 🔄 Smart Git Sync & PR Handoff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Vibe Engine OS"
          git config --global user.email "ai@vibe-engine.local"
          
          BRANCH_NAME="vibe/issue-${{ env.ISSUE_NUMBER }}"
          
          git checkout $BRANCH_NAME || git checkout -b $BRANCH_NAME
          
          git add .
          git commit -m "feat(ai): continuous compilation for #${{ env.ISSUE_NUMBER }}" || echo "No changes to commit"
          
          git push origin $BRANCH_NAME || git push --set-upstream origin $BRANCH_NAME
          
          gh pr create \
            --title "🚀 Vibe Compilation: ${{ env.ISSUE_TITLE }}" \
            --body "Autonomous xmachines compilation complete. Closes #${{ env.ISSUE_NUMBER }}" \
            --base main \
            --head $BRANCH_NAME || echo "PR already exists, continuing."
