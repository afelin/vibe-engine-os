name: Sovereign OS Event Bus

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: os-thread-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  run-os:
    runs-on: ubuntu-latest
    if: ${{ !github.event.sender.bot }}
    
    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚡ Ultra-Fast Runtime (Bun)
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 📦 Install System Utilities (Cached)
        run: bun install -g repomix typescript vitest wrangler

      - name: ⚙️ Optimize Git for Autonomous Scale (Git 2.55+)
        run: |
          git config --global core.fsmonitor true
          git config --global repack.writeBitmaps true

      - name: 🗺️ Map Global State
        run: repomix --output repomix-output.txt

      - name: 🔀 Route Event Context
        id: context
        run: |
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "ISSUE_BODY=${{ github.event.comment.body }}" >> $GITHUB_ENV
            echo "ISSUE_NUMBER=${{ github.event.issue.number }}" >> $GITHUB_ENV
            echo "ISSUE_TITLE=${{ github.event.issue.title }} (Revision)" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" == "pull_request_review" ]; then
            echo "ISSUE_BODY=${{ github.event.review.body }}" >> $GITHUB_ENV
            echo "ISSUE_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
            echo "ISSUE_TITLE=${{ github.event.pull_request.title }} (PR Feedback)" >> $GITHUB_ENV
          else
            echo "ISSUE_BODY=${{ github.event.issue.body }}" >> $GITHUB_ENV
            echo "ISSUE_NUMBER=${{ github.event.issue.number }}" >> $GITHUB_ENV
            echo "ISSUE_TITLE=${{ github.event.issue.title }}" >> $GITHUB_ENV
          fi

      - name: 🧠 Fire AI Inference Ratchet (agent.ts)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bun run agent.ts

      - name: 🧹 Hardware-Accelerated Formatting (oxlint & oxfmt)
        continue-on-error: true
        run: |
          bunx oxlint@latest --fix
          bunx oxfmt@latest -w .

      - name: 🚀 Deploy Vibe Blueprint to Cloudflare Edge
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Compress repository pack metrics using Git 2.55 incremental chaining
          git repack --write-midx=incremental
          
          # Edge deployment execution block via Wrangler CLI
          if [ ! -z "$CLRE_API_TOKEN" ]; then
            PREVIEW_URL=$(bunx wrangler pages deploy . --project-name="vibe-engine-os" --branch="vibe/issue-${{ env.ISSUE_NUMBER }}" | grep "Take a peek" | awk '{print $4}')
            echo "PREVIEW_URL=$PREVIEW_URL" >> $GITHUB_ENV
          else
            echo "PREVIEW_URL=https://cloudflare-preview-not-configured.local" >> $GITHUB_ENV
          fi

      - name: 🔄 Smart Git Sync & PR Handoff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Vibe Engine OS"
          git config --global user.email "ai@vibe-engine.local"
          
          BRANCH_NAME="vibe/issue-${{ env.ISSUE_NUMBER }}"
          git checkout $BRANCH_NAME || git checkout -b $BRANCH_NAME
          
          git add .
          git commit -m "feat(ai): causal compilation & edge deployment for #${{ env.ISSUE_NUMBER }}" || echo "No changes to commit"
          git push origin $BRANCH_NAME || git push --set-upstream origin $BRANCH_NAME
          
          gh pr create \
            --title "🚀 Vibe Compilation: ${{ env.ISSUE_TITLE }}" \
            --body "Autonomous xmachines compilation complete. Evaluated via Vitest. Formatted via Oxlint.
            
            🌐 **Live Edge Preview URL:** ${{ env.PREVIEW_URL }}
            
            Closes #${{ env.ISSUE_NUMBER }}" \
            --base main \
            --head $BRANCH_NAME || echo "PR already exists, updated in place."
