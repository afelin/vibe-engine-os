name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'papers/**'
      - 'proof/**'
      - 'scripts/build-whitepaper.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Build white paper + unify proof into site/
        run: node scripts/build-whitepaper.mjs

      # Pages root is site/ only (from site/ + papers/ + proof/). Never deploy internal/ or GTM.
      - name: Guard — Pages artifact has no internal/GTM paths
        run: |
          set -euo pipefail
          if [[ -e site/internal ]] || find site -iname '*go-to-market*' | grep -q .; then
            echo "Refuse to deploy: internal or go-to-market path under site/" >&2
            exit 1
          fi

      # First deploy: repo may have no Pages site yet (has_pages=false → 404 from API).
      # enablement: true lets GITHUB_TOKEN create/configure Pages for Actions builds.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
