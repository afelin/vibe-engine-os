name: Coreward Request
description: Structured task for Coreward — Intent, Outcome, Files; then Go / Approve / Merge
title: "[coreward] "
labels:
  - vibe/run
  - vibe:safe
body:
  - type: markdown
    attributes:
      value: |
        **How this works:** Fill the fields below, submit the issue, and Coreward runs from the issue body.

        **Operator loop:** `/go` (what next?) · `/approve` (only when cockpit asks) · **Merge** when the PR is green.

        **Bound files:** list **2–4 exact paths** under Files to touch.

        Advanced labels (CI dual-read): `vibe:plan-only`, `vibe:ship`, `vibe:explain-*` — optional after submit.

  - type: textarea
    id: intent
    attributes:
      label: Intent (one sentence)
      description: What should change, in plain language?
      placeholder: "Add a health-check endpoint so deploys can verify the app is alive."
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Outcome (how we know it's done)
      description: Checklist or acceptance criteria. Keep it testable.
      placeholder: |
        - GET /health returns { "ok": true }
        - Unit test covers the happy path
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Files to touch (exact paths)
      description: List 2–4 paths (required at depth ≥ 2). Scopes codegen and TaskBond.
      placeholder: |
        src/health.ts
        src/health.test.ts
    validations:
      required: false

  - type: dropdown
    id: depth
    attributes:
      label: Depth
      description: Safe is the default. Change labels after submit if needed.
      options:
        - safe — small/safe codegen (default)
        - plan-only — plan only, no codegen
        - ship — tests + broader scope
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints (optional)
      description: Protected paths, things to avoid, or scope limits.
      placeholder: |
        Do not change package.json
        No auth / protected paths
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Extra context (optional)
      description: Links or 2–3 bullets max. Avoid pasting long chat logs.
      placeholder: |
        Related issue #12
    validations:
      required: false
