name: Coreward Starter
description: Prefilled safe starter — first green PR via Go → Merge
title: "[coreward] cloud-loop smoke — verify forever loop is alive"
labels:
  - vibe/run
  - vibe:safe
body:
  - type: markdown
    attributes:
      value: |
        **First green PR.** Submit as-is (or tweak lightly).

        **Operator loop:** `/go` → wait for PR → **Merge** when green. Use `/approve` only if cockpit pauses on a protected path.

  - type: textarea
    id: intent
    attributes:
      label: Intent (one sentence)
      description: What should change, in plain language?
      value: Export cloud-loop smoke status so CI can verify the forever loop is alive.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Outcome (how we know it's done)
      description: Checklist or acceptance criteria. Keep it testable.
      value: |
        - Unit test passes
        - cloudLoopSmokeStatus === "v1-cloud-loop-ok"
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Files to touch (exact paths)
      description: Bound paths for TaskBond / codegen scope.
      value: |
        src/cloud-loop-smoke.ts
        src/cloud-loop-smoke.test.ts
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints (optional)
      description: Protected paths, things to avoid, or scope limits.
      value: |
        Do not change package.json
        Stay on the two smoke files above
    validations:
      required: false
